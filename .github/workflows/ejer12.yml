name: Copia de Seguridad
on:
  push:
    #branches: [ main ]

jobs:
  ejecutar_script:
    runs-on: ubuntu-lastest
    steps:
    - name: descargar repositorio
      uses: actions/checkout@v5
      
    - name: crear carpeta backup
      run:
        mkdir -p backup
        
    - name: crear zip comprimido
      run:
        zip -r backup_datos.zip datos
        
    - name: Subir artefacto
      uses: actions/upload-checkout@v5